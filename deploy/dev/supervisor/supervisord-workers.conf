[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord-worker.pid
user=root

[unix_http_server]
file=/tmp/supervisor-worker.sock
chmod=0770
chown=root:www-data

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor-worker.sock

[program:bulk-expand-consumer]
command=php /app/artisan notifications:consume-bulk-expand --prefetch=%(ENV_BULK_EXPAND_PREFETCH)s
user=www-data
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
numprocs=%(ENV_BULK_EXPAND_NUMPROCS)s
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=APP_ENV="%(ENV_APP_ENV)s"

[program:sender-transactional]
command=php /app/artisan notifications:send --queue=transactional --prefetch=%(ENV_SENDER_PREFETCH)s
user=www-data
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=35
numprocs=%(ENV_SENDER_TX_NUMPROCS)s
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=APP_ENV="%(ENV_APP_ENV)s"

[program:sender-marketing]
command=php /app/artisan notifications:send --queue=marketing --prefetch=%(ENV_SENDER_PREFETCH)s
user=www-data
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=35
numprocs=%(ENV_SENDER_MK_NUMPROCS)s
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=APP_ENV="%(ENV_APP_ENV)s"

[program:outbox-relay]
command=php /app/artisan messaging:outbox-relay
    --batch-size=%(ENV_OUTBOX_RELAY_BATCH_SIZE)s
    --idle-sleep-ms=%(ENV_OUTBOX_RELAY_IDLE_SLEEP_MS)s
numprocs=%(ENV_OUTBOX_RELAY_NUMPROCS)s
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=unexpected
priority=10
stopsignal=TERM
stopwaitsecs=20
environment=APP_ENV="%(ENV_APP_ENV)s"
