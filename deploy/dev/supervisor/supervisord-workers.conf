[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord-worker.pid
user=root

[unix_http_server]
file=/tmp/supervisor-worker.sock
chmod=0770
chown=root:www-data

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor-worker.sock

[program:outbox-relay]
command=php /app/artisan messaging:outbox-relay
    --batch-size=%(ENV_OUTBOX_RELAY_BATCH_SIZE)s
    --idle-sleep-ms=%(ENV_OUTBOX_RELAY_IDLE_SLEEP_MS)s
numprocs=%(ENV_OUTBOX_RELAY_NUMPROCS)s
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=unexpected
priority=10
stopsignal=TERM
stopwaitsecs=20
environment=APP_ENV="%(ENV_APP_ENV)s"
