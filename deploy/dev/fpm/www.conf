[www]
user = www-data
group = www-data

listen = 9000

; Вместо постоянного создания/удаления процессов PHP-FPM сразу держит их готовыми
pm = static
pm.max_children = 10

request_terminate_timeout = 1800
request_slowlog_timeout = 0

catch_workers_output = yes
decorate_workers_output = no

; Позволяет PHP видеть переменные окружения из docker-compose.yml
clear_env = no
