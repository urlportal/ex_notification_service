services:

  postgres:
    image: 'postgres:18.1-bookworm'
    container_name: '${APP_NAME}-postgres'
    restart: "unless-stopped"
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root_pass
      NOTIFY_USER: '${DB_USERNAME}'
      NOTIFY_PASSWORD: '${DB_PASSWORD}'
      NOTIFY_DB: '${DB_DATABASE}'
    volumes:
      - 'postgres_data:/var/lib/postgresql'
      - './deploy/dev/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  rabbitmq:
    image: 'rabbitmq:3.13-management'
    container_name: '${APP_NAME}-rabbitmq'
    restart: "unless-stopped"
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_UI_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-guest}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-guest}'
      RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_VHOST:-/}'
    volumes:
      - ./deploy/dev/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/dev/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - internal

  redis:
    image: 'redis:7.0.9-alpine'
    container_name: '${APP_NAME}-redis'
    restart: "unless-stopped"
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - 'redis_data:/data'
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  nginx:
    image: 'nginx:1.27-alpine'
    container_name: '${APP_NAME}-nginx'
    restart: "unless-stopped"
    ports:
      - '${APP_PORT:-8080}:80'
    volumes:
      - ./:/app
      - ./deploy/dev/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - internal

  php:
    build:
      context: .
      dockerfile: deploy/dev/Dockerfile
      args:
        CONTAINER_EXEC_USER_ID: "${CONTAINER_EXEC_USER_ID:-1000}"
        CONTAINER_EXEC_GROUP_ID: "${CONTAINER_EXEC_GROUP_ID:-1000}"
    container_name: '${APP_NAME}-php'
    command: php-fpm --nodaemonize
    environment:
      XDEBUG_TRIGGER: 1
      XDEBUG_MODE: 'develop,debug'
      PHP_IDE_CONFIG: 'serverName=0.0.0.0'
      COMPOSER_CACHE_DIR: /var/cache/composer
    working_dir: /app
    restart: "unless-stopped"
    volumes:
      - ./:/app
      - composer_cache:/var/cache/composer
      - ./deploy/dev/fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  workers:
    build:
      context: .
      dockerfile: deploy/dev/Dockerfile
      args:
        CONTAINER_EXEC_USER_ID: "${CONTAINER_EXEC_USER_ID:-1000}"
        CONTAINER_EXEC_GROUP_ID: "${CONTAINER_EXEC_GROUP_ID:-1000}"
    container_name: '${APP_NAME}_workers'
    command: /usr/local/bin/worker-entrypoint.sh
    environment:
      OUTBOX_RELAY_NUMPROCS: '${OUTBOX_RELAY_NUMPROCS:-2}'
      OUTBOX_RELAY_BATCH_SIZE: '${OUTBOX_RELAY_BATCH_SIZE:-100}'
      OUTBOX_RELAY_IDLE_SLEEP_MS: '${OUTBOX_RELAY_IDLE_SLEEP_MS:-500}'
    working_dir: /app
    restart: "no"
    volumes:
      - ./:/app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    name: "${APP_NAME}-internal"
    driver: bridge
    external: false

volumes:
  postgres_data:
    name: "${APP_NAME}-postgres-data"
  redis_data:
    name: "${APP_NAME}-redis-data"
  composer_cache:
    name: "${APP_NAME}-composer-cache"
